
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGSS Society</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            background: white;
            padding: 40px 25px;
            margin: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            max-width: 500px;
        }
        h1 { color: #1d4ed8; }
        p { color: #475569; line-height: 1.7; }
        .status {
            display: inline-block;
            background: #fef3c7;
            color: #92400e;
            padding: 8px 14px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PGSS Society</h1>
        <div class="status">Website Under Construction</div>
        <p>We are building our new website.</p>
        <p>Please visit us again soon!</p>
    </div>
</body>
</html>
